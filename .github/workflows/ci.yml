name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q scripts
      - run: PYTHONPATH=scripts:. python -m unittest discover -s tests -t . -q
      - run: python -m json.tool examples/config.json >/dev/null
      - run: python -m json.tool examples/sources.json >/dev/null

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile -t proxy-pool:test .
